<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        Daily Checker
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

<div class="app">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="brand">

            <div class="brand-logo">
                ✓
            </div>

            <div>

                <h1>
                    Daily Checker
                </h1>

                <p>
                    Build better days
                </p>

            </div>

        </div>


        <nav>

            <a
                href="{{ url_for('dashboard') }}"
                class="{% if request.endpoint == 'dashboard' %}active{% endif %}"
            >
                <span>▦</span>
                Today
            </a>


            <a
                href="{{ url_for('history') }}"
                class="{% if request.endpoint == 'history' %}active{% endif %}"
            >
                <span>◷</span>
                History & Notes
            </a>


            <a
                href="{{ url_for('analytics') }}"
                class="{% if request.endpoint == 'analytics' %}active{% endif %}"
            >
                <span>⌁</span>
                Analytics
            </a>

        </nav>


        <div class="sidebar-bottom">

            <p>
                Stay consistent.
                <br>
                Small wins add up.
            </p>

        </div>

    </aside>


    <!-- MAIN -->

    <main class="main">

        {% block content %}
        {% endblock %}

    </main>

</div>


<script
    src="{{ url_for('static', filename='js/app.js') }}"
></script>


{% block scripts %}
{% endblock %}

</body>

</html>
